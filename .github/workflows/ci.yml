name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skills
        run: python scripts/check_skills.py
      - name: Node tests
        run: node --test tests/*.test.mjs zauran-story-engine/tests/*.test.mjs zauran-character-forge/tests/*.test.mjs
      - name: Python tests
        run: |
          pip install markdown
          python -m unittest discover -s zauran-story-engine/tests -p "test_*.py" 2>&1 | tee py.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then grep -E -A 12 '^(ERROR|FAIL):' py.log | sed 's/^/::error::/'; fi
          exit $status
